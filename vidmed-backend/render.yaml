services:
  # Backend Django Web Service
  - type: web
    name: vidmed-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn vidmed_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: vidmed_project.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vidmed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vidmed-redis
          type: redis
          property: connectionString

  # Celery Worker
  - type: worker
    name: vidmed-celery
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A vidmed_project worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: vidmed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vidmed-redis
          type: redis
          property: connectionString

  # Celery Beat Scheduler
  - type: worker
    name: vidmed-beat
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A vidmed_project beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: vidmed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vidmed-redis
          type: redis
          property: connectionString

databases:
  - name: vidmed-db
    plan: free
    region: oregon
    databaseName: vidmed
    user: vidmed

  - name: vidmed-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
